<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Get VocLock</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  /* Download hop for social bios (Instagram, TikTok ...). In-app browsers on Android
     often don't hand https://play.google.com links to the Play Store app; an
     intent:// link with package=com.android.vending does. System fonts only. */
  :root { --bg: #efe6d2; --fg: #0e2a47; --muted: #4a5a6a; --accent: #1f4e79; --on-accent: #efe6d2; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b1a2c; --fg: #efe6d2; --muted: #a9b6c4; --accent: #7fa8d1; --on-accent: #0b1a2c; color-scheme: dark; }
  }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    background: var(--bg); color: var(--fg); font: 17px/1.55 "Segoe UI", system-ui, -apple-system, sans-serif;
    text-align: center;
  }
  main { max-width: 26rem; }
  h1 { font-size: 1.7rem; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 20px; }
  .btn {
    display: inline-block; background: var(--accent); color: var(--on-accent); text-decoration: none;
    font-weight: 700; padding: 14px 26px; border-radius: 999px; margin-bottom: 18px;
  }
  .btn:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
  small { display: block; color: var(--muted); font-size: 0.85rem; }
  small a { color: var(--accent); }
</style>
</head>
<body>
  <main>
    <h1 id="t">Opening Google Play …</h1>
    <p id="s">VocLock is free on Google Play.</p>
    <a class="btn" id="go" href="https://play.google.com/store/apps/details?id=com.voclock">Open Google Play</a>
    <small id="h">Nothing happens? Tap ⋮ at the top and choose “Open in Chrome” (or “Open in browser”).</small>
    <small><a href="/">littlelockstudio.app</a></small>
  </main>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var clean = function (v, d) { return ((v || d) + "").replace(/[^a-z0-9_-]/gi, "").slice(0, 32) || d; };
  var src = clean(q.get("src") || q.get("utm_source"), "website");
  var medium = clean(q.get("medium"), "social");
  var ref = encodeURIComponent("utm_source=" + src + "&utm_medium=" + medium + "&utm_campaign=launch");
  var web = "https://play.google.com/store/apps/details?id=com.voclock&referrer=" + ref;
  var android = /android/i.test(navigator.userAgent);
  var target = android
    ? "intent://details?id=com.voclock&referrer=" + ref +
      "#Intent;scheme=market;package=com.android.vending;S.browser_fallback_url=" + encodeURIComponent(web) + ";end"
    : web;
  var go = document.getElementById("go");
  go.href = target;

  if (/^de\b/i.test(navigator.language || "")) {
    document.documentElement.lang = "de";
    document.title = "VocLock laden";
    document.getElementById("t").textContent = "Google Play wird geöffnet …";
    document.getElementById("s").textContent = "VocLock ist kostenlos bei Google Play.";
    go.textContent = "Google Play öffnen";
    document.getElementById("h").textContent =
      "Passiert nichts? Oben auf ⋮ tippen und „In Chrome öffnen“ (bzw. „Im Browser öffnen“) wählen.";
  }
  // Auto-forward; some in-app browsers only allow the intent after a tap, so the button stays.
  setTimeout(function () { location.href = target; }, 150);
})();
</script>
</body>
</html>
